name: Build Ryadom Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "android/**"
      - ".github/workflows/android-apk.yml"

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@v4

      - name: Cache official TDLib Android build
        id: tdlib-cache
        uses: actions/cache@v4
        with:
          path: .tdlib-out
          key: tdlib-android-arm64-d1085f9cebc5a62379991ae1652673954f229c1f

      - name: Build official TDLib from Telegram source
        if: steps.tdlib-cache.outputs.cache-hit != 'true'
        env:
          DOCKER_BUILDKIT: "1"
        run: |
          rm -rf tdlib-source .tdlib-out
          git clone --depth 1 https://github.com/tdlib/td.git tdlib-source
          cd tdlib-source/example/android
          docker build             --build-arg COMMIT_HASH=d1085f9cebc5a62379991ae1652673954f229c1f             --build-arg TDLIB_INTERFACE=Java             --output "$GITHUB_WORKSPACE/.tdlib-out"             .

      - name: Inject TDLib Java API and native libraries
        run: |
          rm -rf .tdlib-unpacked
          mkdir -p .tdlib-unpacked
          unzip -q .tdlib-out/tdlib.zip -d .tdlib-unpacked
          mkdir -p android/app/src/main/java/org
          cp -R .tdlib-unpacked/tdlib/java/org/drinkless android/app/src/main/java/org/
          mkdir -p android/app/src/main/jniLibs
          cp -R .tdlib-unpacked/tdlib/libs/* android/app/src/main/jniLibs/
          find android/app/src/main/jniLibs -maxdepth 2 -type f -name "*.so" -print

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android SDK 37
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"             "platforms;android-37"             "build-tools;36.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.6.0"

      - name: Build debug APK
        working-directory: android
        run: gradle :app:assembleDebug --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: Ryadom-0.3-Telegram
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
