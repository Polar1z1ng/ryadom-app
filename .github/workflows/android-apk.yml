name: Build Ryadom Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "android/**"
      - ".github/workflows/android-apk.yml"

concurrency:
  group: ryadom-android-main
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - uses: actions/checkout@v4

      - name: Validate approved splash JPEG
        shell: bash
        run: |
          set -euxo pipefail
          test -f android/app/src/main/res/drawable-nodpi/ryadom_splash_exact.jpg
          python3 - <<'PY'
          from pathlib import Path

          p = Path("android/app/src/main/res/drawable-nodpi/ryadom_splash_exact.jpg")
          data = p.read_bytes()
          assert data[:2] == b"\xff\xd8", "Splash is not a JPEG"
          assert data[-2:] == b"\xff\xd9", "Splash JPEG is truncated"

          sof = {0xC0,0xC1,0xC2,0xC3,0xC5,0xC6,0xC7,0xC9,0xCA,0xCB,0xCD,0xCE,0xCF}
          i = 2
          width = height = None
          while i + 9 < len(data):
              if data[i] != 0xFF:
                  i += 1
                  continue
              marker = data[i+1]
              if marker in (0xD8, 0xD9):
                  i += 2
                  continue
              seglen = int.from_bytes(data[i+2:i+4], "big")
              if marker in sof:
                  height = int.from_bytes(data[i+5:i+7], "big")
                  width = int.from_bytes(data[i+7:i+9], "big")
                  break
              if seglen < 2:
                  break
              i += 2 + seglen

          assert (width, height) == (258, 653), f"Unexpected splash size: {width}x{height}"
          assert len(data) == 8095, f"Unexpected splash byte length: {len(data)}"
          print(f"Validated splash source: {width}x{height}, {len(data)} bytes")
          PY
          file android/app/src/main/res/drawable-nodpi/ryadom_splash_exact.jpg

      - name: Fetch pinned prebuilt TDLib used by Telegram X
        shell: bash
        run: |
          set -euxo pipefail
          rm -rf .tgx-tdlib
          git lfs install --skip-repo
          GIT_LFS_SKIP_SMUDGE=1 git clone --depth 1 https://github.com/TGX-Android/tdlib.git .tgx-tdlib
          test "$(git -C .tgx-tdlib rev-parse HEAD)" = "a032dcf147860482bbf96a6c9206faf63d335ab0"

          git -C .tgx-tdlib lfs pull --include="src/main/libs/27.3.13750724/arm64-v8a/libtdjni.so,openssl/27.3.13750724/arm64-v8a/lib/libcryptox.so,openssl/27.3.13750724/arm64-v8a/lib/libsslx.so"

          rm -rf android/app/src/main/java/org/drinkless
          mkdir -p android/app/src/main/java/org/drinkless/tdlib
          cp .tgx-tdlib/src/main/java/org/drinkless/tdlib/Client.java android/app/src/main/java/org/drinkless/tdlib/
          cp .tgx-tdlib/src/main/java/org/drinkless/tdlib/TdApi.java android/app/src/main/java/org/drinkless/tdlib/

          rm -rf android/app/src/main/jniLibs
          mkdir -p android/app/src/main/jniLibs/arm64-v8a
          cp .tgx-tdlib/src/main/libs/27.3.13750724/arm64-v8a/libtdjni.so android/app/src/main/jniLibs/arm64-v8a/
          cp .tgx-tdlib/openssl/27.3.13750724/arm64-v8a/lib/libcryptox.so android/app/src/main/jniLibs/arm64-v8a/
          cp .tgx-tdlib/openssl/27.3.13750724/arm64-v8a/lib/libsslx.so android/app/src/main/jniLibs/arm64-v8a/

          test "$(stat -c%s android/app/src/main/jniLibs/arm64-v8a/libtdjni.so)" -gt 1000000
          test "$(stat -c%s android/app/src/main/jniLibs/arm64-v8a/libcryptox.so)" -gt 100000
          test "$(stat -c%s android/app/src/main/jniLibs/arm64-v8a/libsslx.so)" -gt 100000
          ls -lh android/app/src/main/jniLibs/arm64-v8a/

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android SDK 36
        shell: bash
        run: |
          set -euxo pipefail
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0" "ndk;27.3.13750724"
          cp "$ANDROID_HOME/ndk/27.3.13750724/toolchains/llvm/prebuilt/linux-x86_64/sysroot/usr/lib/aarch64-linux-android/libc++_shared.so" android/app/src/main/jniLibs/arm64-v8a/
          test "$(stat -c%s android/app/src/main/jniLibs/arm64-v8a/libc++_shared.so)" -gt 500000
          ls -lh android/app/src/main/jniLibs/arm64-v8a/libc++_shared.so

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.6.0"

      - name: Run risk engine tests
        working-directory: android
        run: gradle :app:testDebugUnitTest --stacktrace

      - name: Build debug APK
        working-directory: android
        run: gradle :app:assembleDebug --stacktrace

      - name: Verify APK
        shell: bash
        run: |
          set -euxo pipefail
          APK="android/app/build/outputs/apk/debug/app-debug.apk"
          test -f "$APK"
          ls -lh "$APK"
          unzip -l "$APK" | grep -E "lib/arm64-v8a/(libtdjni|libsslx|libcryptox)\\.so"
          AAPT2="$ANDROID_HOME/build-tools/36.0.0/aapt2"
          test -x "$AAPT2"
          "$AAPT2" dump resources "$APK" > /tmp/resources.txt
          grep -q "drawable/ryadom_splash_exact" /tmp/resources.txt
          grep -A3 -B2 "drawable/ryadom_splash_exact" /tmp/resources.txt
          echo "APK verification passed: TDLib native libs and splash drawable are packaged."

      - uses: actions/upload-artifact@v4
        with:
          name: Ryadom-0.6.4-safe-jpeg-splash
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
