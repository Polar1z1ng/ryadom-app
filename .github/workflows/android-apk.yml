name: Build Android APK
on:
  workflow_dispatch:
  push:
    paths:
      - "Ryadom_Test_0_2.zip"
      - ".github/workflows/android-apk.yml"

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Unpack project
        run: |
          rm -rf buildsrc
          mkdir buildsrc
          unzip -q Ryadom_Test_0_2.zip -d buildsrc

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3

      - name: Install Android SDK
        run: sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Build debug APK
        working-directory: buildsrc/Ryadom_Test_0_2/android
        run: gradle :app:assembleDebug --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: Ryadom-test-apk
          path: buildsrc/Ryadom_Test_0_2/android/app/build/outputs/apk/debug/app-debug.apk
